services:

  # -------------------------
  # PHP Application Container
  # -------------------------
  app:
    container_name: app
    build:
      context: .
      dockerfile: Docker/development/php/Dockerfile
    volumes:
      - .:/var/www
      - /var/www/vendor
    ports:
      - "9000:9000"
    working_dir: /var/www
    depends_on:
      - db
    networks:
      - pic2bim
  # -------------------------
  # Node (Vite Hot Reload)
  # -------------------------
  node:
    image: node:22
    container_name: node
    working_dir: /var/www
    entrypoint: ["sh", "-c", "chmod +x /entrypoint.sh && /entrypoint.sh"]
    volumes:
      - .:/var/www
      - /var/www/node_modules
      - ./Docker/development/node/entrypoint.sh:/entrypoint.sh
    ports:
      - "5173:5173"
    networks:
      - pic2bim
  # -------------------------
  # Nginx Web Server
  # -------------------------
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8081:80"
    volumes:
      - .:/var/www
      - ./Docker/development/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
      - db
    networks:
      - pic2bim
  
  # -------------------------
  # PostgreSQL Database
  # -------------------------
  db:
    image: postgis/postgis:17-3.5
    container_name: postgres
    volumes:
      - pgdata:/var/lib/postgresql
      - ./Docker/common/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: laravel_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
    networks:
      - pic2bim
  # -------------------------
  # PG Admin Container
  # -------------------------
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgAdmin
    ports:
      - "5050:80"
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: test@pic2bim.com
      PGADMIN_DEFAULT_PASSWORD: password
networks:
  pic2bim:
    driver: bridge

volumes:
  pgdata:
