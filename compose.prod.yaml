version: "3.9"

services:

  app:
    build:
      context: .
      dockerfile: Docker/php/Dockerfile
    container_name: app
    volumes:
      # - .:/var/www
      - storage:/var/www/storage
      - public_build:/var/www/public
      # - /var/www/vendor
    ports:
      - "9000:9000"
    depends_on:
      - db
    networks:
      - laravel

  # node:
  #   image: node:22
  #   container_name: node
  #   working_dir: /var/www
  #   command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
  #   volumes:
  #     - .:/var/www
  #     - /var/www/node_modules
  #   ports:
  #     - "5173:5173"
  #   networks:
  #     - laravel

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      # - .:/var/www
      - public_build:/var/www/public
      - ./Docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: postgis/postgis:15-3.4
    container_name: postgres
    volumes:
      - pgdata:/var/lib/postgresql
      - ./Docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: laravel_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  pgdata:
  storage:
  public_build:
